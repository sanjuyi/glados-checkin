name: GLaDOS 自动签到

on:
  schedule:
    # 每天 01:23 UTC = 北京时间 09:23 执行签到。
    # 刻意避开整点：GitHub 的调度器在整点（分钟 00）最拥堵，实测整点任务被延迟过 4 小时 48 分，
    # 挪到 :23 会明显好一些（官方也承认定时任务在高峰期会被延迟）。
    - cron: '23 1 * * *'
    # 每月 1 号 00:00 UTC 做一次保活提交，避免仓库 60 天无活动被 GitHub 自动停掉定时任务
    - cron: '0 0 1 * *'
  # 支持在 GitHub 网页上手动触发（第一次验证时用这个）
  workflow_dispatch:

# 同一时间只允许一个签到任务，避免手动触发和定时任务撞车造成重复请求
concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: 签到
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          sparse-checkout: .

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: python -m pip install --upgrade pip requests

      - name: 语法自检
        run: python -m py_compile checkin.py

      - name: 执行签到
        env:
          # 单账号用 GLADOS_COOKIE；多账号用 GLADOS_COOKIE_1 / _2 / _3 ... 连续编号
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_COOKIE_1: ${{ secrets.GLADOS_COOKIE_1 }}
          GLADOS_COOKIE_2: ${{ secrets.GLADOS_COOKIE_2 }}
          GLADOS_COOKIE_3: ${{ secrets.GLADOS_COOKIE_3 }}
          GLADOS_COOKIE_4: ${{ secrets.GLADOS_COOKIE_4 }}
          GLADOS_COOKIE_5: ${{ secrets.GLADOS_COOKIE_5 }}
          # 可选：Telegram 通知，不配置就只写日志和摘要
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python checkin.py

  keepalive:
    name: 保活（每月 1 号）
    # 只在每月 1 号那条 cron 上运行；手动触发时不跑
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 提交一次空提交保持仓库活跃
        # 若仓库的 Workflow permissions 被设为只读，这一步会失败但不影响签到：
        # 到 Settings → Actions → General → Workflow permissions 改成 Read and write 即可
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(keepalive): $(date -u +%Y-%m-%d)"
          git push
